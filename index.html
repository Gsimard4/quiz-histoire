<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Histoire — G. Simard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap');
  :root{--accent:#3f6fd8;--dark:#05070f;--mid:#0a0e1c;--card:#101528;--card2:#161d33;
        --border:#1e2846;--border2:#2c3a63;--text:#e2e8f5;--muted:#5f6f95;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;padding-bottom:50px;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(120,150,220,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,220,0.045) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  header{position:relative;text-align:center;padding:48px 20px 34px;border-bottom:1px solid var(--border);}
  h1{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;letter-spacing:6px;line-height:1;}
  h1 span{color:var(--accent);}
  .tagline{font-family:'Barlow Condensed',sans-serif;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-size:0.9rem;margin-top:8px;}
  .prof{margin-top:14px;font-size:0.95rem;color:var(--muted);}
  .prof b{color:var(--text);}
  .wrap{position:relative;max-width:1080px;margin:0 auto;padding:34px 20px;}
  h2.section{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:3px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:8px;margin:34px 0 20px;}
  h2.section:first-child{margin-top:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;}
  .quiz-card{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:9px;transition:transform .2s,border-color .2s;}
  .quiz-card:hover{transform:translateY(-3px);border-color:var(--accent);}
  .cat{font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .quiz-card h3{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:1.5px;line-height:1.1;}
  .quiz-card h3 small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;letter-spacing:1.5px;color:var(--muted);margin-top:3px;}
  .desc{font-size:0.9rem;color:var(--muted);line-height:1.5;flex:1;}
  .meta{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:3px 9px;font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;color:var(--muted);letter-spacing:1px;}
  .links{display:flex;gap:8px;margin-top:4px;}
  .lnk{flex:1;text-align:center;text-decoration:none;border-radius:6px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-size:0.92rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:filter .2s;}
  .lnk:hover{filter:brightness(1.15);}
  .lnk-prof{background:var(--accent);color:#05070f;}
  .lnk-eleve{background:var(--card2);color:var(--text);border:1px solid var(--border2);}
  .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
  .tool{text-decoration:none;color:var(--muted);border:1px solid var(--border2);border-radius:6px;padding:9px 16px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;transition:color .2s,border-color .2s;}
  .tool:hover{color:var(--text);border-color:var(--accent);}
  footer{text-align:center;color:var(--muted);font-size:0.85rem;padding:24px;}
  @media(max-width:600px){h1{font-size:2.2rem;letter-spacing:3px;}}
</style>
</head>
<body>

<header>
  <h1>QUIZ <span>HISTOIRE</span></h1>
  <div class="tagline">Portail des quiz interactifs</div>
  <div class="prof">Professeur : <b>G. Simard</b></div>
  <div class="tools">
    <a class="tool" href="editeur.html">✎ Éditeur de quiz</a>
  </div>
</header>

<div class="wrap">
  <h2 class="section">Histoire des révolutions · 330-HJ1-LG</h2>
  <div class="grid" id="grid-revolutions"></div>

  <h2 class="section">Quiz antérieurs</h2>
  <div class="grid" id="grid-anciens"></div>
</div>

<footer>Quiz Histoire · G. Simard · gsimard4.github.io/quiz-histoire</footer>

<script>
/* Pour ajouter un quiz : dépose son fichier dans quiz/ et ajoute son nom ici. */
const QUIZ_REVOLUTIONS = [
  "revolution-francaise-1",
  "revolution-francaise-2"
];

/* Les anciens quiz gardent leur ancien dossier — rien à y changer. */
const ANCIENS = [
  {dossier:"totalitarisme",            cat:"XXe siècle · Politique",       titre:"La montée du totalitarisme", desc:"Fascisme, nazisme et stalinisme : idéologies, régimes, personnages clés et mécanismes de terreur.", n:12, t:30},
  {dossier:"revolution-bolchevique",   cat:"Début XXe · Russie",           titre:"La Révolution bolchévique",  desc:"Du régime tsariste vacillant à la dictature bolchévique : causes, 1905 et 1917, Lénine et la naissance de l'URSS.", n:10, t:20},
  {dossier:"guerre-mondiale-1",        cat:"XXe siècle · Conflits",        titre:"La 2e Guerre mondiale",      desc:"L'Axe et les Alliés, les coups de force d'Hitler, le Blitzkrieg, la Bataille d'Angleterre, Barbarossa et Stalingrad.", n:10, t:20},
  {dossier:"deuxieme-guerre-mondiale-2",cat:"XXe siècle · Conflits",       titre:"La 2e Guerre mondiale — 2",  desc:"Débarquements, effondrement de l'Axe, capitulation du Japon, la Shoah et le bilan du conflit.", n:10, t:20},
  {dossier:"guerre-froide",            cat:"XXe siècle · Bloc B",          titre:"La Guerre froide",           desc:"Doctrine Truman, Plan Marshall, OTAN, maccarthysme, course à l'espace et fin des Trente Glorieuses.", n:10, t:20},
  {dossier:"asie-decolonisation",      cat:"XXe siècle · Bloc B",          titre:"Décolonisation",             desc:"Gandhi, Mao, Hô Chi Minh, guerre du Viêt Nam : indépendances en Asie et en Afrique, naissance du tiers-monde.", n:10, t:20},
  {dossier:"mouvements-culturels",     cat:"XXe siècle · Bloc B",          titre:"Mouvements culturels",       desc:"Féminisme, beatniks, hippies, droits civiques, Mai 68 : le choc des valeurs de l'après-guerre.", n:10, t:20}
];

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function carte({cat,titre,sous,desc,n,t,lienProf,lienEleve}){
  return `<div class="quiz-card">
    <div class="cat">${esc(cat)}</div>
    <h3>${esc(titre)}${sous?`<small>${esc(sous)}</small>`:''}</h3>
    <div class="desc">${esc(desc)}</div>
    <div class="meta"><span class="chip">${n} questions</span><span class="chip">${t} s / question</span></div>
    <div class="links">
      <a class="lnk lnk-prof"  href="${lienProf}">▶ Vue professeur</a>
      <a class="lnk lnk-eleve" href="${lienEleve}">👤 Vue élève</a>
    </div>
  </div>`;
}

async function chargerRevolutions(){
  const cible=document.getElementById('grid-revolutions');
  const cartes=await Promise.all(QUIZ_REVOLUTIONS.map(async id=>{
    try{
      const d=await (await fetch(`quiz/${id}.json`,{cache:'no-store'})).json();
      return carte({
        cat:d.categorie||'', titre:d.titre, sous:d.sousTitre, desc:d.description||'',
        n:(d.questions||[]).length, t:d.tempsParDefaut||30,
        lienProf:`moteur/prof.html?quiz=${id}`, lienEleve:`moteur/eleve.html?quiz=${id}`
      });
    }catch(e){
      return `<div class="quiz-card"><div class="cat">Erreur</div><h3>${esc(id)}</h3>
              <div class="desc">Le fichier <code>quiz/${esc(id)}.json</code> est introuvable ou mal formé.</div></div>`;
    }
  }));
  cible.innerHTML=cartes.join('');
}

document.getElementById('grid-anciens').innerHTML = ANCIENS.map(q=>carte({
  cat:q.cat, titre:q.titre, sous:'', desc:q.desc, n:q.n, t:q.t,
  lienProf:`${q.dossier}/prof.html`, lienEleve:`${q.dossier}/eleve.html`
})).join('');

chargerRevolutions();
</script>
</body>
</html>
